[project]
name = "cocktail-hub"
version = "0.1.0"
description = "Cocktail laptop hub: all live processing for the Quest client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.8",
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# GPU machine only (A3). Blackwell needs CUDA 12.8+ wheels: `uv sync --group gpu`.
gpu = [
    "clearvoice>=0.1.2",
    "torch>=2.7",
    "torchaudio>=2.7",
    "transformers>=4.40",
]

# Benchmark harness for the A6 model comparison (eval/). Also needs the gpu group for torch:
#   uv sync --group gpu --group bench
bench = [
    "soundfile",
    "huggingface_hub",
    "speechbrain",
    "pandas",
    "asteroid>=0.7.0",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One package per owned folder (PRD section 14). Add yours here when you create it.
[tool.hatch.build.targets.wheel]
packages = ["protocol", "ingest", "mockclient", "separate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
