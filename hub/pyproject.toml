[project]
name = "cocktail-hub"
version = "0.1.0"
description = "Cocktail laptop hub: all live processing for the Quest client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.8",
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One package per owned folder (PRD section 14). Add yours here when you create it.
[tool.hatch.build.targets.wheel]
packages = ["protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
